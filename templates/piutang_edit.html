{% extends "base.html" %}
{% block title %}Edit Piutang - FinansialApp{% endblock %}
{% block page_title %}Edit Piutang{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-lg-6">
<div class="card">
  <div class="card-header py-2 px-3">
    <i class="fas fa-edit text-primary me-2"></i>
    <span class="fw-semibold">Edit Piutang</span>
  </div>
  <div class="card-body">
  <form method="POST">
    <div class="row g-3">
      <div class="col-6">
        <label class="form-label fw-semibold">Tanggal *</label>
        <input type="date" name="tanggal" class="form-control" value="{{ p.tanggal }}" required>
      </div>
      <div class="col-6">
        <label class="form-label fw-semibold">Jatuh Tempo</label>
        <input type="date" name="jatuh_tempo" class="form-control" value="{{ p.jatuh_tempo or '' }}">
      </div>
      <div class="col-12">
        <label class="form-label fw-semibold">Pelanggan *</label>
        <input type="text" name="pelanggan" class="form-control" value="{{ p.pelanggan }}" required>
      </div>
      <div class="col-12">
        <label class="form-label fw-semibold">Keterangan</label>
        <input type="text" name="keterangan" class="form-control" value="{{ p.keterangan or '' }}">
      </div>
      <div class="col-12">
        <label class="form-label fw-semibold">Jumlah</label>
        <div class="input-group">
          <span class="input-group-text">Rp</span>
          <input type="text" class="form-control bg-body-secondary" value="{{ p.jumlah|rp }}" readonly>
        </div>
        <div class="form-text text-muted">
          <i class="fas fa-lock fa-xs me-1"></i>Jumlah tidak dapat diubah, sudah terikat jurnal.
          Sudah dibayar: {{ p.terbayar|rp }}
        </div>
      </div>
      <div class="col-12 d-flex gap-2 justify-content-end">
        <a href="/piutang" class="btn btn-outline-secondary">Batal</a>
        <button type="submit" class="btn btn-primary">
          <i class="fas fa-save me-1"></i>Simpan Perubahan</button>
      </div>
    </div>
  </form>
  </div>
</div>
</div>
</div>
{% endblock %}
